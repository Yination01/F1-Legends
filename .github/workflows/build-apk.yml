name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Copy game to web assets
        working-directory: app
        run: npm run copy-game

      - name: Add Android platform
        working-directory: app
        run: npx cap add android

      - name: Apply F1 Legends app icons
        working-directory: app
        run: cp -R assets/android-icons/* android/app/src/main/res/

      - name: Build debug APK
        working-directory: app
        run: bash android/gradlew -p android assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: F1-Legends-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.2-${{ github.run_number }}
          files: app/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
